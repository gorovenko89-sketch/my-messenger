<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мій Месенджер</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="auth-overlay">
        <div id="auth-box">
            <h2>Вхід у секретний чат</h2>
            <input type="text" id="auth-username" placeholder="Твій нік (напр. Дмитро)">
            <div class="password-wrapper">
                <input type="password" id="auth-password" placeholder="Пароль">
                <button type="button" id="toggle-password" title="Показати пароль">👁️</button>
            </div>
            <div class="auth-buttons">
                <button id="login-btn">Увійти</button>
                <button id="register-btn">Реєстрація</button>
            </div>
            <p id="auth-msg"></p>
        </div>
    </div>

    <div id="chat-container" style="display: none;">
        <h1>Мій секретний чат 💬
            <div id="online-container">
                <span id="online-count">В мережі: 0</span>
                <div id="online-dropdown">
                    <ul id="online-users-list"></ul>
                </div>
            </div>
        </h1>
        <ul id="messages"></ul>
        <div id="typing-indicator"></div>
        <form id="form">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <input id="input" autocomplete="off" placeholder="Напиши повідомлення..." />
            <button type="button" id="image-btn">🖼️</button>
            <button type="button" id="record-btn">🎤</button>
            <button type="submit" id="send-btn">🚀</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>

</html>
