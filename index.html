<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мій Месенджер</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="auth-overlay">
        <div class="box">
            <div class="auth-content">
                <h2>Секретний чат</h2>

                <div class="inputBox">
                    <input type="text" id="auth-username" required="required" autocomplete="off">
                    <span>Нікнейм</span>
                    <i></i>
                </div>

                <div class="inputBox">
                    <input type="password" id="auth-password" required="required">
                    <span>Пароль</span>
                    <i></i>
                    <button type="button" id="toggle-password" title="Показати пароль">👁️</button>
                </div>

                <p id="auth-msg"></p>

                <div class="auth-actions">
                    <button type="button" id="login-btn" class="submit-btn">Увійти</button>
                    <button type="button" id="register-btn" class="submit-btn register-style">Реєстрація</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-container" style="display: none;">
        <h1>Сімейний чат 💬
            <div id="online-container">
                <span id="online-count">В мережі: 0</span>
                <div id="online-dropdown">
                    <ul id="online-users-list"></ul>
                </div>
            </div>
        </h1>
        <ul id="messages"></ul>
        <div id="typing-indicator"></div>
        <form id="form">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <input id="input" autocomplete="off" placeholder="Напиши повідомлення..." />
            <button type="button" id="image-btn">🖼️</button>
            <button type="button" id="record-btn">🎤</button>
            <button type="submit" id="send-btn">🚀</button>
        </form>
    </div>
    <div id="image-modal">
        <span class="close-modal">&times;</span>
        <img id="modal-img">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
    
</body>

</html>
